name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python tools
        run: pip install jsonschema
      - name: Validate every program file
        run: python3 tools/validate.py
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Install JavaScript test tools
        run: npm ci
      - name: JavaScript tests (logic and page behavior in jsdom)
        run: node --test tests/*.test.mjs
      - name: Rebuild data and pages
        run: |
          python3 tools/build_data.py
          python3 tools/build.py
      - name: Fail if generated files are out of date
        run: |
          git diff --exit-code -- data/entries.json data/entries.csv data/meta.json sitemap.xml robots.txt '*.html' || {
            echo "::error::Generated files are out of date. Run: python3 tools/build_data.py && python3 tools/build.py, then commit."
            exit 1
          }
      - name: No em dashes or en dashes in text
        run: |
          if grep -rIl --exclude-dir=.git --exclude-dir=fonts --exclude-dir=node_modules -P '\x{2014}|\x{2013}' . ; then
            echo "::error::Found an em dash or en dash. Use a comma, colon, or the word 'to'."
            exit 1
          fi

  lib-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install JavaScript test tools
        run: npm ci
      - name: lib.js coverage floor (takes about 8 minutes)
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=assets/js/lib.js
          --test-coverage-lines=99 --test-coverage-branches=97
          tests/*.test.mjs

  page-script-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install JavaScript test tools
        run: npm ci
      - name: Run the tests and keep the V8 coverage dumps (takes about 8 minutes)
        run: NODE_V8_COVERAGE=coverage-v8 node --test tests/*.test.mjs
      - name: Page script line coverage floors
        run: >-
          COVERAGE_DIR=coverage-v8 COVERAGE_OUT=coverage-page-scripts.txt
          node --test tests/r3-tests-5-page-script-coverage-floor.test.mjs
