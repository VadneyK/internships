name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install Python tools
        run: pip install -r requirements-dev.txt
      - name: Validate every program file
        run: python3 tools/validate.py
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Rebuild data and pages
        run: |
          python3 tools/build_data.py
          python3 tools/build.py
      - name: Fail if generated files are out of date
        run: |
          git diff --exit-code -- data/entries.json data/entries.csv data/meta.json data/lite data/detail sitemap.xml robots.txt '*.html' || {
            echo "::error::Generated files are out of date. Run: python3 tools/build_data.py && python3 tools/build.py, then commit."
            exit 1
          }
      - name: No em dashes or en dashes in text
        run: |
          if grep -rIl --exclude-dir=.git --exclude-dir=fonts --exclude-dir=node_modules -P '\x{2014}|\x{2013}' . ; then
            echo "::error::Found an em dash or en dash. Use a comma, colon, or the word 'to'."
            exit 1
          fi

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install JavaScript test tools
        run: npm ci
      - name: JavaScript tests, shard ${{ matrix.shard }} of 4 (logic and page behavior in jsdom)
        run: node --test --test-shard=${{ matrix.shard }}/4 tests/*.test.mjs

  # The one required status check. Branch protection names "check", so this job
  # keeps that name and fails unless every job it needs succeeded.
  check:
    needs: [python, js]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless python and every js shard succeeded
        run: |
          if [ "${{ needs.python.result }}" != "success" ] || [ "${{ needs.js.result }}" != "success" ]; then
            echo "::error::python is ${{ needs.python.result }}, js is ${{ needs.js.result }}"
            exit 1
          fi

  lib-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Under coverage, two jsdom-heavy test files ran out of heap with the default limit (CI runs 38277532726 and 38294892812).
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install JavaScript test tools
        run: npm ci
      - name: lib.js coverage floor (takes about 8 minutes)
        run: >-
          node --test --test-concurrency=2 --experimental-test-coverage
          --test-coverage-include=assets/js/lib.js
          --test-coverage-lines=99 --test-coverage-branches=97
          tests/*.test.mjs

  page-script-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Under coverage, two jsdom-heavy test files ran out of heap with the default limit (CI runs 38277532726 and 38294892812).
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install JavaScript test tools
        run: npm ci
      - name: Run the tests and keep the V8 coverage dumps (takes about 8 minutes)
        run: NODE_V8_COVERAGE=coverage-v8 node --test --test-concurrency=2 tests/*.test.mjs
      - name: Page script line coverage floors
        run: >-
          COVERAGE_DIR=coverage-v8 COVERAGE_OUT=coverage-page-scripts.txt
          node --test tests/r3-tests-5-page-script-coverage-floor.test.mjs
