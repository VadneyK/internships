name: Monthly refresh list

on:
  schedule:
    - cron: "5 15 1 * *" # 1st of each month, 15:05 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the refresh list
        run: python3 tools/freshness.py --out refresh.md --max-items 150 --full-out refresh-full.md
      - name: Keep the full list with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-full
          path: refresh-full.md
          if-no-files-found: ignore
      - name: Open an issue if anything needs a look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^- \[ \]' refresh.md; then
            # GitHub rejects an issue body over 65536 characters. Keep well under it.
            head -c 60000 refresh.md > refresh-body.md
            gh issue create --title "Refresh list $(date -u +%Y-%m)" --label refresh --body-file refresh-body.md
          else
            echo "Everything is fresh."
          fi
