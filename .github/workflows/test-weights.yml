name: Measure test file times (for balanced CI shards)

# Run by hand after adding or changing slow tests. It times every test file on a GitHub runner, the same machine
# type the js shards use, and uploads tests/test-weights.json. Download it and commit it; tools/shard.mjs reads it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: test-weights, cancel-in-progress: false }

jobs:
  weights:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install JavaScript test tools
        run: npm ci
      - name: Time every test file, two at a time with coverage on, as the js shards run them
        run: node tools/time_tests.mjs 2
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/coverage-v8
      - name: Upload tests/test-weights.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-weights
          path: tests/test-weights.json
          retention-days: 7
