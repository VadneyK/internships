name: Weekly mutation test of lib.js

on:
  schedule:
    - cron: "17 6 * * 0" # Sundays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: mutation, cancel-in-progress: false }

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install JavaScript test tools
        run: npm ci
      - name: Mutate assets/js/lib.js (fails below thresholds.break in stryker.config.json)
        run: npx stryker run
      - name: Upload the HTML mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore
          retention-days: 14
